name: Validation

on:
  pull_request:
    branches:
      - main
      - testing
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONLINT_VERSION: 1.7.7
  HADOLINT_VERSION: 2.14.0
  JUST_VERSION: 1.52.0
  SHELLCHECK_VERSION: 0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  ZIZMOR_VERSION: 1.25.2
  ZIZMOR_SHA256: aa1facd105f0d83fe5c55b1adcd9d7417de5d83aa27471f91dc0b66cf3803577
  NODE_VERSION: "22"

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache validation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kyth-ci-tools
          key: validation-tools-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}-${{ env.HADOLINT_VERSION }}-${{ env.JUST_VERSION }}-${{ env.SHELLCHECK_VERSION }}-${{ env.ZIZMOR_VERSION }}

      - name: Install pinned validators
        run: ./build_files/scripts/install-validation-tools.sh
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Cache apt (validation)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-validation-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install system dependencies for validation
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt $attempt failed, retrying..." >&2
            sleep 5
            if [[ $attempt -eq 3 ]]; then
              echo "::error::apt-get update failed after 3 attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends file systemd
        shell: bash --noprofile --norc -euo pipefail {0}

      # The validation runner image provides rustup but does not guarantee a
      # configured default toolchain. The repository test suite compiles the
      # shared Rust runtime directly, so establish the same stable toolchain
      # used by the Hub and installer shell jobs before running validate.sh.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Check Dockerfile build rules
        run: |
          if command -v docker >/dev/null 2>&1; then
            just check-dockerfile
          else
            echo "::notice::Docker not available, skipping Dockerfile build check"
          fi
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Run repository validation suite
        run: ./build_files/scripts/validate.sh
        shell: bash --noprofile --norc -euo pipefail {0}

  quality:
    name: coverage and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache pip (quality)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-quality-${{ runner.os }}-${{ hashFiles('requirements-quality.txt') }}
          restore-keys: |
            pip-quality-${{ runner.os }}-

      - name: Cache validation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kyth-ci-tools
          key: validation-tools-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}-${{ env.HADOLINT_VERSION }}-${{ env.JUST_VERSION }}-${{ env.SHELLCHECK_VERSION }}-${{ env.ZIZMOR_VERSION }}
          restore-keys: |
            validation-tools-${{ runner.os }}-

      - name: Install pinned validators
        run: ./build_files/scripts/install-validation-tools.sh
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Install pinned quality tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-quality.txt
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Run Python quality gates (changed-only on PR)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./build_files/scripts/run-quality.sh --changed-only
          else
            ./build_files/scripts/run-quality.sh
          fi
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
            coverage-html
          if-no-files-found: warn
          retention-days: 14

  hub-shell:
    name: Hub web shell (React + Tauri) build check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/kyth-hub-web/package-lock.json

      # rustup ships preinstalled on ubuntu-latest, so drive it directly rather
      # than via a toolchain action: kyth-os's Actions policy only permits
      # allowlisted publishers, and the usual `dtolnay/rust-toolchain` isn't one
      # (its `stable` ref is also a moving branch, so SHA-pinning it as the
      # policy demands would strand us on a stale toolchain resolution).
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Cache cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/kyth-hub-web/src-tauri/target
          key: cargo-hub-shell-${{ runner.os }}-${{ hashFiles('src/kyth-hub-web/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-hub-shell-${{ runner.os }}-

      - name: Cache apt (hub-shell)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-hub-shell-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install Tauri Linux build prerequisites
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt $attempt failed, retrying..." >&2
            sleep 5
            if [[ $attempt -eq 3 ]]; then
              echo "::error::apt-get update failed after 3 attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev pkg-config build-essential
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Install pinned validators
        run: ./build_files/scripts/install-validation-tools.sh
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Build frontend and build the Tauri shell
        run: just check-hub-shell
        shell: bash --noprofile --norc -euo pipefail {0}

  installer-shell:
    name: Installer web shell (React + Tauri) build check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/kyth-installer-web/package-lock.json

      # See hub-shell's identical step for why rustup is driven directly
      # rather than via a toolchain action.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Cache cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/kyth-installer-web/src-tauri/target
          key: cargo-installer-shell-${{ runner.os }}-${{ hashFiles('src/kyth-installer-web/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-installer-shell-${{ runner.os }}-

      - name: Cache apt (installer-shell)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-installer-shell-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install Tauri Linux build prerequisites
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15; then
              break
            fi
            echo "::warning::apt-get update attempt $attempt failed, retrying..." >&2
            sleep 5
            if [[ $attempt -eq 3 ]]; then
              echo "::error::apt-get update failed after 3 attempts" >&2
              exit 1
            fi
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev pkg-config build-essential
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Install pinned validators
        run: ./build_files/scripts/install-validation-tools.sh
        shell: bash --noprofile --norc -euo pipefail {0}

      - name: Build frontend and build the Tauri shell
        run: just check-installer-shell
        shell: bash --noprofile --norc -euo pipefail {0}
