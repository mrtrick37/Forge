name: Build Live ISO
run-name: "Build Live ISO - ${{ inputs.source_tag || github.ref_name || 'testing' }}"

on:
  # Separate from container build — ISO failures no longer hide successful
  # container publishes. build.yml's finalize job dispatches this explicitly
  # (workflow_dispatch, pinned digest) once the Fedora image actually
  # publishes. There is deliberately no workflow_run trigger here: a
  # workflow_run listener cannot tell a skipped/gated image run from a real
  # publish, and previously fired a doomed ISO build racing the actual one.
  # The explicit dispatch only ever fires from the leg that did real work.
  workflow_call:
    inputs:
      source_tag:
        description: Source image tag to build ISO from
        required: false
        type: string
        # Fedora variant only — the live ISO must boot the signed Fedora kernel
        # for Secure Boot. The -cachy image has no Fedora kernel and would fail.
        default: testing
      source_digest:
        description: Optional pinned source image digest
        required: false
        type: string
        default: ""
      source_sha:
        description: Source commit matching source_digest
        required: false
        type: string
        default: ""
      run_acceptance:
        description: >
          Gate publication on the unattended VM acceptance run (live boot →
          install → installed boot). Off by default — a full run costs
          ~1.5h of hosted-runner KVM time on every push, too expensive to
          run unconditionally on this pipeline. Opt in for a higher-
          confidence run (e.g. before promoting to main/stable) via
          workflow_dispatch with this set to true.
        required: false
        type: boolean
        default: false
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ENDPOINT_URL:
        required: false
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source image tag to build ISO from
        required: false
        default: latest
        type: choice
        # Fedora variants only — the live ISO must boot the signed Fedora kernel
        # for Secure Boot. The -cachy images have no Fedora kernel and the ISO
        # build will hard-fail on them by design.
        options:
          - latest
          - testing
      source_digest:
        description: Immutable source image digest from the build workflow
        required: false
        type: string
      source_sha:
        description: Source commit matching source_digest
        required: false
        type: string
      run_acceptance:
        description: >
          Gate publication on the unattended VM acceptance run. Off by
          default (~1.5h of hosted-runner KVM time) — opt in for a higher-
          confidence run before promoting to main/stable.
        required: false
        type: boolean
        default: false
      update_ref:
        description: >
          Optional second image ref. When set, acceptance also proves staged
          update activation and rollback across reboots.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-live-iso-${{ inputs.source_tag || github.ref_name || 'testing' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ISO (${{ inputs.source_tag || github.ref_name || 'testing' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      iso_basename: ${{ steps.release.outputs.iso_basename }}
      channel_basename: ${{ steps.release.outputs.channel_basename }}
      immutable_tag: ${{ steps.release.outputs.immutable_tag }}
      source_image: ${{ steps.source_image.outputs.name }}
      source_digest: ${{ steps.source_image.outputs.digest }}
      effective_tag: ${{ steps.effective.outputs.tag }}

    steps:
      # workflow_call and workflow_dispatch both declare a defaulted
      # source_tag, so inputs.source_tag is always set — there is no third
      # trigger left that could leave it empty (the workflow_run listener
      # that used to fall back to the triggering run's branch/sha is gone).
      - name: Resolve effective source tag
        id: effective
        env:
          INPUT_TAG: ${{ inputs.source_tag }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_DIGEST: ${{ inputs.source_digest }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          TAG="${INPUT_TAG:-testing}"
          SHA="${INPUT_SHA}"
          DIGEST="${INPUT_DIGEST}"
          echo "tag=${TAG}" >&3
          echo "sha=${SHA}" >&3
          echo "digest=${DIGEST}" >&3
          echo "Effective source tag=${TAG} sha=${SHA:0:8} digest=${DIGEST:0:12}" >&2

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.effective.outputs.sha || (startsWith(steps.effective.outputs.tag, 'testing') && 'testing' || 'main') }}
          persist-credentials: false

      - name: Prepare immutable release identity
        id: release
        env:
          SOURCE_TAG: ${{ steps.effective.outputs.tag }}
        run: |
          python3 build_files/scripts/release_identity.py \
            --source-tag "${SOURCE_TAG}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Prepare live ISO build space
        # /, /mnt, Docker, and rootful Podman all share /dev/root on GitHub's
        # hosted runner. Reclaim both preinstalled tool payloads and Docker data
        # before allocating the sparse btrfs image used by the ISO build.
        uses: ./.github/actions/free-disk-space
        with:
          report: 'true'
          extra-docker-cleanup: 'true'

      - name: Verify available space for live ISO build
        run: |
          set -euo pipefail
          available_kb="$(df --output=avail /mnt | awk 'NR == 2 {print $1}')"
          # podman-storage.img is intentionally sparse: its 65 GiB logical size
          # does not need 65 GiB of physical backing. Successful builds produce
          # roughly 7 GiB ISOs; 28 GiB leaves room for the pulled image, payload
          # layers, Titanoboa workspace, and final artifact on current 72 GiB
          # hosted runners.
          required_kb=$((28 * 1024 * 1024))
          if (( available_kb < required_kb )); then
            echo "::error::Need at least 28 GiB free on /mnt for the live ISO build; found $((available_kb / 1024 / 1024)) GiB."
            exit 1
          fi

      - name: Mount compressed Podman storage
        uses: ./.github/actions/setup-compressed-storage

      # finalize dispatches this workflow with an explicit source_digest, so
      # in practice this step only ever runs for a manual workflow_dispatch
      # that left source_digest blank — fall back to this run's own artifact
      # (present when called via workflow_call) before resolving the moving
      # tag downstream.
      - name: Load build metadata from this run
        id: build_metadata
        if: steps.effective.outputs.digest == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ steps.effective.outputs.tag }}
          EFFECTIVE_DIGEST: ${{ steps.effective.outputs.digest }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          # Prefer an explicitly supplied digest (workflow_call)
          if [[ -n "${EFFECTIVE_DIGEST}" ]]; then
            echo "digest=${EFFECTIVE_DIGEST}" >&3
            exit 0
          fi
          # Try current run's artifact (workflow_call from build.yml)
          if gh run download "${GITHUB_RUN_ID}" \
            -n "image-build-metadata-${SOURCE_TAG}" \
            -D "${RUNNER_TEMP}/build-metadata" 2>/dev/null; then
            METADATA="${RUNNER_TEMP}/build-metadata/image.json"
            jq -e . "${METADATA}" >/dev/null
            DIGEST="$(jq -r .digest "${METADATA}")"
            build_files/scripts/validate-digest.sh "${DIGEST}"
            echo "Pinned source digest from build metadata: ${DIGEST}"
            echo "digest=${DIGEST}" >&3
            exit 0
          fi
          echo "::notice::No image-build-metadata-${SOURCE_TAG} artifact in this run; the moving ${SOURCE_TAG} tag will be resolved instead"

      - name: Resolve source image digest
        id: source_image
        uses: ./.github/actions/fetch-image-metadata
        with:
          image-tag: ${{ steps.effective.outputs.tag }}
          expected-digest: ${{ steps.effective.outputs.digest || steps.build_metadata.outputs.digest }}

      - name: Verify source image revision matches checkout
        env:
          REVISION: ${{ steps.source_image.outputs.revision }}
        run: |
          EXPECTED_REVISION="$(git rev-parse HEAD)"
          if [[ "${REVISION}" != "${EXPECTED_REVISION}" ]]; then
            echo "::error::Source image built from revision '${REVISION:-<missing>}', but this ISO workflow checked out '${EXPECTED_REVISION}'. Re-run the image build for this commit, then pass its digest as source_digest."
            exit 1
          fi

      - name: Build live payload container
        env:
          SOURCE_TAG: ${{ steps.effective.outputs.tag }}
          SOURCE_IMAGE_PINNED: ${{ steps.source_image.outputs.pinned }}
        run: |
          # No registry cache — podman/buildah cache syntax is incompatible
          # with buildx type=registry (and bare tagged refs are rejected by
          # newer podman as "must contain neither tag nor digest"). Keep the
          # build hermetic; re-add cache only with --layers + untagged cache
          # repo or a docker-buildx payload step.
          sudo podman build \
            --cap-add SYS_ADMIN \
            --security-opt label=disable \
            --build-arg "BASE_IMAGE=${SOURCE_IMAGE_PINNED}" \
            --build-arg "SOURCE_TAG=${SOURCE_TAG}" \
            --tag localhost/payload:latest \
            -f installer/Containerfile \
            .

      - name: Report disk usage after payload build
        run: |
          df -h / /mnt /var/lib/containers
          sudo du -sh /mnt/podman-storage.img

      - name: Prepare ISO output directory
        run: mkdir -p output/live-iso

      - name: Build ISO with Titanoboa
        # This third-party action is pinned, but still runs only in the
        # credential-free build job because it performs privileged operations.
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ runner.temp }}/kyth-live-${{ steps.effective.outputs.tag }}.iso

      - name: Report disk usage after ISO build
        run: |
          df -h / /mnt /var/lib/containers
          sudo du -sh /mnt/podman-storage.img
          du -h "${RUNNER_TEMP}/kyth-live-${SOURCE_TAG}.iso"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_TAG: ${{ steps.effective.outputs.tag }}

      - name: Move and verify ISO
        run: |
          ISO="output/live-iso/${STEPS_RELEASE_OUTPUTS_ISO_BASENAME}"
          mv "${RUNNER_TEMP}/kyth-live-${SOURCE_TAG}.iso" "${ISO}"
          sudo chown "$(id -u):$(id -g)" "${ISO}"
          test -s "${ISO}"
          test -r "${ISO}"
          test -w "${ISO}"
          echo "==> Built $(du -h "${ISO}" | cut -f1) ISO: ${ISO}"
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_TAG: ${{ steps.effective.outputs.tag }}
          STEPS_RELEASE_OUTPUTS_ISO_BASENAME: ${{ steps.release.outputs.iso_basename }}

      - name: Generate ISO checksums
        run: |
          ISO="output/live-iso/${STEPS_RELEASE_OUTPUTS_ISO_BASENAME}"
          CHANNEL_CHECKSUM="output/live-iso/${STEPS_RELEASE_OUTPUTS_CHANNEL_BASENAME}-CHECKSUM"
          (cd "$(dirname "${ISO}")" && sha256sum "$(basename "${ISO}")" > "$(basename "${ISO}")-CHECKSUM")
          SHA256="$(sha256sum "${ISO}" | awk '{print $1}')"
          printf '%s  %s\n' "${SHA256}" "${STEPS_RELEASE_OUTPUTS_CHANNEL_BASENAME}" \
            > "${CHANNEL_CHECKSUM}"
        env:
          STEPS_RELEASE_OUTPUTS_ISO_BASENAME: ${{ steps.release.outputs.iso_basename }}
          STEPS_RELEASE_OUTPUTS_CHANNEL_BASENAME: ${{ steps.release.outputs.channel_basename }}

      - name: Upload unsigned ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: output/live-iso/*
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: VM acceptance (${{ inputs.source_tag || needs.build.outputs.effective_tag }})
    needs: build
    # Off by default from both entry points (see run_acceptance above) — a
    # maintainer opts in for a higher-confidence run, which is why publish
    # tolerates a *skipped* acceptance but never a failed one.
    # workflow_dispatch delivers even boolean-typed inputs as strings on the
    # runtime `inputs` context (a long-standing GitHub Actions quirk), so a
    # bare truthiness check here was true for the *string* "false" too --
    # this job ran unconditionally regardless of the caller's intent.
    if: ${{ inputs.run_acceptance == true || inputs.run_acceptance == 'true' }}
    runs-on: ubuntu-latest
    # The script's own budget is 90m; the extra headroom covers artifact
    # download, QEMU install, and log upload on a cold runner.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - name: Free disk space
        # The installed guest writes into a 64 GiB qcow2 alongside a ~7 GiB
        # ISO, and /, /mnt and the container stores all share /dev/root here.
        uses: ./.github/actions/free-disk-space
        with:
          report: 'true'
          extra-docker-cleanup: 'true'

      - name: Cache apt (acceptance)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-acceptance-${{ hashFiles('.github/workflows/build-live-iso.yml') }}

      - name: Install QEMU acceptance dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-system-modules-spice qemu-utils ovmf socat

      - name: Grant runner access to /dev/kvm
        # Hosted Linux runners expose KVM but leave the node owned by root:kvm
        # with no runner membership; the static_node rule is what makes it
        # usable without a re-login. vm-acceptance.sh hard-refuses TCG because
        # a full desktop install never finishes under emulation.
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm is not usable on this runner; acceptance cannot run" >&2
            exit 1
          fi
          echo "KVM available: $(ls -l /dev/kvm)"

      - name: Prepare acceptance workspace
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/kyth-acceptance/iso /mnt/kyth-acceptance/artifacts
          sudo chown -R "$(id -u):$(id -g)" /mnt/kyth-acceptance
          df -h / /mnt

      - name: Download built ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /mnt/kyth-acceptance/iso

      - name: Verify transferred ISO
        env:
          ISO_BASENAME: ${{ needs.build.outputs.iso_basename }}
        run: |
          set -euo pipefail
          cd /mnt/kyth-acceptance/iso
          test -s "${ISO_BASENAME}"
          sha256sum --check --strict "${ISO_BASENAME}-CHECKSUM"

      - name: Run unattended VM acceptance
        env:
          ISO_BASENAME: ${{ needs.build.outputs.iso_basename }}
          UPDATE_REF: ${{ inputs.update_ref }}
        run: |
          set -euo pipefail
          args=(
            --iso "/mnt/kyth-acceptance/iso/${ISO_BASENAME}"
            --artifacts /mnt/kyth-acceptance/artifacts
            --timeout-minutes 90
          )
          if [[ -n "${UPDATE_REF}" ]]; then
            args+=(--update-ref "${UPDATE_REF}")
          fi
          build_files/scripts/vm-acceptance.sh "${args[@]}"

      - name: Upload acceptance artifacts
        # Uploaded on failure too — the serial log and phase screendumps are
        # the only forensics for a guest that never reached a sentinel.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-acceptance-${{ inputs.source_tag || needs.build.outputs.effective_tag }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            /mnt/kyth-acceptance/artifacts/serial.log
            /mnt/kyth-acceptance/artifacts/qemu.log
            /mnt/kyth-acceptance/artifacts/qualification.json
            /mnt/kyth-acceptance/artifacts/qualification.md
            /mnt/kyth-acceptance/artifacts/*.ppm
          if-no-files-found: warn
          retention-days: 7

      - name: Publish acceptance summary
        if: always()
        run: |
          set -euo pipefail
          REPORT=/mnt/kyth-acceptance/artifacts/qualification.md
          if [[ -s "${REPORT}" ]]; then
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No qualification report produced; see uploaded serial.log." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish:
    name: Publish ISO (${{ inputs.source_tag || needs.build.outputs.effective_tag }})
    needs: [build, acceptance]
    # A skipped acceptance (emergency dispatch) still publishes; a failed or
    # cancelled one must not.
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && (needs.acceptance.result == 'success' || needs.acceptance.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # As a reusable workflow this sees the caller's github context: stable
    # publishes from scheduled rebuilds or the repository owner (push or
    # manual dispatch) skip the approval gate via stable-release-auto; only
    # builds triggered by anyone else keep the manual gate on stable-release.
    environment: ${{ (inputs.source_tag || needs.build.outputs.effective_tag) == 'testing' && 'testing-release' || (github.event_name == 'schedule' || github.actor == github.repository_owner) && 'stable-release-auto' || 'stable-release' }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup ORAS
        uses: ./.github/actions/setup-oras
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Grype
        id: setup_grype
        uses: ./.github/actions/setup-anchore-tool
        with:
          tool: grype
          version: 0.88.0

      - name: Pull source image SBOM
        id: current_sbom
        uses: ./.github/actions/pull-sbom-referrer
        with:
          image-ref: ${{ needs.build.outputs.source_image }}@${{ needs.build.outputs.source_digest }}
          dest-dir: ${{ runner.temp }}/current-sbom

      - name: Warn if source image has no SBOM
        if: steps.current_sbom.outputs.path == ''
        run: echo "::warning::No SBOM attached to source image; CVE section will be skipped"

      - name: Scan source image with Grype
        id: grype_current
        if: steps.current_sbom.outputs.path != ''
        env:
          GRYPE_CMD: ${{ steps.setup_grype.outputs.cmd }}
          SBOM_PATH: ${{ steps.current_sbom.outputs.path }}
        run: |
          OUT="${RUNNER_TEMP}/grype-current.json"
          "${GRYPE_CMD}" "sbom:${SBOM_PATH}" -o json --file "${OUT}" || \
            echo "::warning::Grype scan failed; security section will be limited"
          [[ -f "${OUT}" ]] && echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous release image digest
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag || needs.build.outputs.effective_tag }}
          IMMUTABLE_TAG: ${{ needs.build.outputs.immutable_tag }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          PREV_DIGEST=""
          PREV_TAG="$(gh release list --limit 30 --json tagName \
            -q ".[] | .tagName | select(startswith(\"iso-${SOURCE_TAG}-\"))" \
            | grep -v "^${IMMUTABLE_TAG}$" | head -1 || true)"
          if [[ -n "${PREV_TAG}" ]]; then
            RELEASE_BODY="$(gh release view "${PREV_TAG}" --json body -q '.body' 2>/dev/null || true)"
            PREV_DIGEST="$(python3 -c "
          import re, sys
          body = sys.stdin.read()
          m = re.search(r'Source image digest: \*\*([^*]+)\*\*', body)
          print(m.group(1) if m else '', end='')
          " <<< "${RELEASE_BODY}" || true)"
          fi
          if [[ -n "${PREV_DIGEST}" ]] && build_files/scripts/validate-digest.sh "${PREV_DIGEST}" 2>/dev/null; then
            echo "digest=${PREV_DIGEST}" >&3
          else
            echo "No previous source digest found; CVE diff will be skipped"
          fi

      - name: Pull previous ISO source image SBOM
        id: previous_sbom
        if: steps.previous_release.outputs.digest != ''
        uses: ./.github/actions/pull-sbom-referrer
        with:
          image-ref: ${{ needs.build.outputs.source_image }}@${{ steps.previous_release.outputs.digest }}
          dest-dir: ${{ runner.temp }}/prev-sbom

      - name: Warn if previous release has no SBOM
        if: steps.previous_release.outputs.digest != '' && steps.previous_sbom.outputs.path == ''
        run: echo "No previous SBOM found; CVE diff will be skipped"

      - name: Scan previous source image with Grype
        id: grype_previous
        if: steps.previous_sbom.outputs.path != ''
        env:
          GRYPE_CMD: ${{ steps.setup_grype.outputs.cmd }}
          PREV_SBOM: ${{ steps.previous_sbom.outputs.path }}
        run: |
          OUT="${RUNNER_TEMP}/grype-previous.json"
          "${GRYPE_CMD}" "sbom:${PREV_SBOM}" -o json --file "${OUT}" || \
            echo "::warning::Grype scan of previous SBOM failed"
          [[ -f "${OUT}" ]] && echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Generate ISO release changelog
        id: iso_changelog
        env:
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag || needs.build.outputs.effective_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SOURCE_IMAGE: ${{ needs.build.outputs.source_image }}
          SOURCE_DIGEST: ${{ needs.build.outputs.source_digest }}
          GRYPE_CURRENT: ${{ steps.grype_current.outputs.path }}
          GRYPE_PREVIOUS: ${{ steps.grype_previous.outputs.path }}
        run: |
          NOTES="$(mktemp --suffix=.md)"
          IMAGE_VERSION="$(skopeo inspect --no-creds \
            "docker://${SOURCE_IMAGE}@${SOURCE_DIGEST}" 2>/dev/null \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty' || true)"
          python3 .github/scripts/kyth_changelog.py \
            --mode iso \
            --repo "${GH_REPO}" \
            --branch "${SOURCE_TAG}" \
            --current-sha "${SOURCE_SHA}" \
            --image "${SOURCE_IMAGE}" \
            --current-digest "${SOURCE_DIGEST}" \
            --image-version "${IMAGE_VERSION}" \
            --grype-current "${GRYPE_CURRENT:-}" \
            --grype-previous "${GRYPE_PREVIOUS:-}" \
            --output "${NOTES}"
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          report: 'true'

      - name: Download built ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: output/live-iso

      - name: Verify transferred artifact
        run: |
          ISO="output/live-iso/${NEEDS_BUILD_OUTPUTS_ISO_BASENAME}"
          test -s "${ISO}"
          (cd output/live-iso && sha256sum --check --strict "${NEEDS_BUILD_OUTPUTS_ISO_BASENAME}-CHECKSUM")
        env:
          NEEDS_BUILD_OUTPUTS_ISO_BASENAME: ${{ needs.build.outputs.iso_basename }}

      - name: Setup Cosign
        uses: ./.github/actions/setup-cosign

      - name: Sign and Attest ISO
        id: attest_iso
        uses: ./.github/actions/attest-artifact
        with:
          subject-path: output/live-iso/${{ needs.build.outputs.iso_basename }}
          cosign-sign: "true"

      - name: Generate signed release metadata
        env:
          SOURCE_TAG: ${{ inputs.source_tag || needs.build.outputs.effective_tag }}
          ATTESTATION_URL: ${{ steps.attest_iso.outputs.attestation-url }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_iso.outputs.bundle-path }}
          ISO_BASENAME: ${{ needs.build.outputs.iso_basename }}
          CHANNEL_BASENAME: ${{ needs.build.outputs.channel_basename }}
          IMMUTABLE_TAG: ${{ needs.build.outputs.immutable_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SOURCE_IMAGE: ${{ needs.build.outputs.source_image }}
          SOURCE_DIGEST: ${{ needs.build.outputs.source_digest }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          ISO="output/live-iso/${ISO_BASENAME}"
          SHA256="$(sha256sum "${ISO}" | awk '{print $1}')"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 build_files/scripts/generate-release-metadata.py \
            --source-tag "${SOURCE_TAG}" \
            --iso-basename "${ISO_BASENAME}" \
            --channel-basename "${CHANNEL_BASENAME}" \
            --sha256 "${SHA256}" \
            --attestation-url "${ATTESTATION_URL}" \
            --immutable-tag "${IMMUTABLE_TAG}" \
            --source-sha "${SOURCE_SHA}" \
            --source-image "${SOURCE_IMAGE}" \
            --source-digest "${SOURCE_DIGEST}" \
            --build-date "${BUILD_DATE}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --output-dir "output/live-iso"

          cp "${ISO}.sig" "output/live-iso/${CHANNEL_BASENAME}.sig"
          cp "${ISO}.bundle" "output/live-iso/${CHANNEL_BASENAME}.bundle"
          test -s "${ATTESTATION_BUNDLE_PATH}"
          cp "${ATTESTATION_BUNDLE_PATH}" "${ISO}.intoto.jsonl"
          cp "${ATTESTATION_BUNDLE_PATH}" "output/live-iso/${CHANNEL_BASENAME}.intoto.jsonl"

      - name: Upload ISO to Cloudflare R2
        uses: ./.github/actions/upload-r2
        with:
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-endpoint-url: ${{ secrets.R2_ENDPOINT_URL }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          iso-basename: ${{ needs.build.outputs.iso_basename }}
          channel-basename: ${{ needs.build.outputs.channel_basename }}

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag || needs.build.outputs.effective_tag }}
          CHANNEL_TAG: ${{ (inputs.source_tag || needs.build.outputs.effective_tag) == 'testing' && 'iso-testing' || 'iso-latest' }}
          IMMUTABLE_TAG: ${{ needs.build.outputs.immutable_tag }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SOURCE_DIGEST: ${{ needs.build.outputs.source_digest }}
          ATTESTATION_URL: ${{ steps.attest_iso.outputs.attestation-url }}
          ISO_BASENAME: ${{ needs.build.outputs.iso_basename }}
          CHANNEL_BASENAME: ${{ needs.build.outputs.channel_basename }}
          ISO_CHANGELOG: ${{ steps.iso_changelog.outputs.path }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 build_files/scripts/publish-release.py \
            --repo "${GH_REPO}" \
            --source-tag "${SOURCE_TAG}" \
            --channel-tag "${CHANNEL_TAG}" \
            --immutable-tag "${IMMUTABLE_TAG}" \
            --release-id "${RELEASE_ID}" \
            --source-sha "${SOURCE_SHA}" \
            --source-digest "${SOURCE_DIGEST}" \
            --attestation-url "${ATTESTATION_URL}" \
            --iso-basename "${ISO_BASENAME}" \
            --channel-basename "${CHANNEL_BASENAME}" \
            --iso-changelog "${ISO_CHANGELOG}" \
            --source-dir "output/live-iso" \
            --run-id "${RUN_ID}"
