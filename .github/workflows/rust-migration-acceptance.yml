name: Rust Migration Acceptance
run-name: "Rust Migration Acceptance - ${{ inputs.image_ref }}"

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: GitHub Actions run containing the exact ISO artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name from artifact_run_id
        required: true
        type: string
      source_sha:
        description: Commit checked out for the source ledgers and image identity
        required: true
        type: string
      image_ref:
        description: Exact promoted image reference or digest
        required: true
        type: string
      update_ref:
        description: Optional distinct image reference for update/rollback
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: Disposable VM timeout
        required: false
        default: "90"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  acceptance:
    name: Exact-image Rust migration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          report: "true"
          extra-docker-cleanup: "true"

      - name: Install QEMU acceptance dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-system-modules-spice qemu-utils ovmf socat skopeo

      - name: Grant runner access to /dev/kvm
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm is not usable on this runner" >&2
            exit 1
          fi

      - name: Prepare acceptance workspace
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "artifact_run_id must be numeric" >&2
            exit 64
          }
          [[ "${TIMEOUT_MINUTES}" =~ ^[1-9][0-9]*$ ]] || {
            echo "timeout_minutes must be a positive integer" >&2
            exit 64
          }
          mkdir -p "${RUNNER_TEMP}/kyth-acceptance/iso" \
            "${RUNNER_TEMP}/kyth-acceptance/evidence"

      - name: Download exact ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/kyth-acceptance/iso
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact ISO checksum
        id: iso
        run: |
          set -euo pipefail
          mapfile -t isos < <(find "${RUNNER_TEMP}/kyth-acceptance/iso" \
            -maxdepth 1 -type f -name '*.iso' -print)
          if (( ${#isos[@]} != 1 )); then
            echo "expected exactly one ISO, found ${#isos[@]}" >&2
            exit 1
          fi
          iso="${isos[0]}"
          sha256sum --check --strict "${iso}-CHECKSUM"
          printf 'iso=%s\n' "${iso}" >>"${GITHUB_OUTPUT}"

      - name: Run exact-image acceptance and preserve evidence
        env:
          ISO_PATH: ${{ steps.iso.outputs.iso }}
          IMAGE_REF: ${{ inputs.image_ref }}
          UPDATE_REF: ${{ inputs.update_ref }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          args=(
            --iso "${ISO_PATH}"
            --image-ref "${IMAGE_REF}"
            --artifacts "${RUNNER_TEMP}/kyth-acceptance/evidence"
            --timeout-minutes "${TIMEOUT_MINUTES}"
          )
          if [[ -n "${UPDATE_REF}" ]]; then
            args+=(--update-ref "${UPDATE_REF}")
          fi
          build_files/scripts/run-rust-migration-acceptance.sh \
            "${args[@]}"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-migration-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/kyth-acceptance/evidence
          if-no-files-found: warn
          retention-days: 14
