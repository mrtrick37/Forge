[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rustix = { version = "0.38", features = ["fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
rusqlite = ["dep:rusqlite"]
telemetry-writer = ["rusqlite"]
